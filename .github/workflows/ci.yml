name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check, test, and build
        run: npm run check

  macos-readonly-smoke:
    name: Read-only smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Discover tools over stdio without mutations
        env:
          MCP_MACOS_ALLOWED_ROOTS: ${{ runner.temp }}
        run: |
          node --input-type=module <<'NODE'
          import { Client } from "@modelcontextprotocol/sdk/client/index.js";
          import { StdioClientTransport } from "@modelcontextprotocol/sdk/client/stdio.js";

          const transport = new StdioClientTransport({
            command: process.execPath,
            args: ["dist/cli.js"],
            stderr: "inherit",
          });
          const client = new Client({ name: "github-actions-readonly-smoke", version: "1.0.0" });

          try {
            await client.connect(transport);
            const result = await client.listTools();
            if (result.tools.length === 0) throw new Error("Server exposed no tools");
            console.error(`Read-only smoke discovered ${result.tools.length} tools`);
          } finally {
            await client.close();
          }
          NODE
