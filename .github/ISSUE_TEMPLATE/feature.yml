name: Feature request
description: Propose a bounded macOS capability or improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow, not only a requested command.
    validations:
      required: true

  - type: textarea
    id: interface
    attributes:
      label: Proposed MCP interface
      description: Suggested tool inputs, structured output, and error cases.
    validations:
      required: true

  - type: dropdown
    id: access
    attributes:
      label: Access level
      options:
        - Read-only
        - Writes local data
        - Installs, removes, downloads, or converts content
        - Runs an application or model
    validations:
      required: true

  - type: textarea
    id: permissions
    attributes:
      label: Permissions and external dependencies
      description: List TCC grants, binaries, network access, downloads, and storage impact.
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Safety boundaries
      description: Explain allowlists, path bounds, mutation flags, confirmation, timeouts, and output limits.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require arbitrary shell execution or arbitrary AppleScript.
          required: true
        - label: I searched existing issues and documentation for a similar request.
          required: true
